function vueTirage(){
  const ts = state.data.tirages, t = ts[0];
  if (!t){
    app.innerHTML = `<a class="back" href="#accueil">‹ Calendrier</a><h1 class="page-title">Tirage du jour</h1>
      <div class="panel"><span class="tape l"></span><h2>${state.jour <= 1 ? "Premier tirage le 2 décembre" : "Le tirage arrive"}</h2>
      <p>Le tirage de chaque case a lieu automatiquement le lendemain à 00h01, parmi tous ceux qui ont atteint l’objectif. Reviens un peu plus tard pour lancer la roue !</p>
      <a class="btn block" href="#accueil">Retour au calendrier</a></div>`;
    return;
  }
  const quand = t.jour === 24 ? "le 24 décembre à 17h01" : `le ${t.jour + 1} décembre à 00h01`;
  const precedents = ts.slice(1).map(p => `<li><span class="k">${p.jour}</span><span class="t"><b>${p.gagnants.length ? esc(p.gagnants.map(x => x.nom).join(", ")) : "Pas de gagnant"}</b><br><span class="muted">${esc(nomJeu(p.jeu))}${p.gagnants.some(x => x.lot) ? " · " + esc(p.gagnants.map(x => x.lot).filter(Boolean).join(", ")) : ""}</span></span></li>`);
  const blocPrec = precedents.length ? `<div class="panel"><h2>Tirages précédents</h2><ul class="lots">${precedents.join("")}</ul></div>` : "";
  const titre = `<a class="back" href="#accueil">‹ Calendrier</a><h1 class="page-title">Tirage de la case ${t.jour}</h1>`;

  if (!t.gagnants.length){
    app.innerHTML = titre + `<div class="panel"><span class="tape l"></span><h2>Pas de gagnant pour cette case</h2>
      <p>${t.nb_qualifies ? "Aucun lot n’était disponible pour ce tirage." : `Personne n’a atteint l’objectif de la case ${t.jour} (${esc(nomJeu(t.jeu))}).`} Rendez-vous à la case suivante !</p>
      <p class="verif">Code de vérification du tirage : ${esc(t.code)}</p></div>` + blocPrec;
    return;
  }
  const roue = t.qualifies.length === 1 ? [t.qualifies[0], t.qualifies[0]] : t.qualifies;
  const sansNoms = roue.length > 20;
  app.innerHTML = titre + `
    <div class="panel"><span class="tape l"></span><span class="tape r"></span>
      <div class="rediff"><span class="rec">● REDIFF</span><div><b>Le tirage a déjà eu lieu, ${quand}</b><span>Il a été fait une seule fois, automatiquement, parmi les <b>${t.nb_qualifies} qualifié${t.nb_qualifies > 1 ? "s" : ""}</b> de la case ${t.jour} (${esc(nomJeu(t.jeu))}). Ce que tu vas voir est la rediffusion du résultat enregistré : la roue s’arrête toujours sur le même gagnant, pour tout le monde.</span></div></div>
      <div class="wheel-wrap"><span class="pointer"></span><span class="wheel-tag">Rediffusion</span><svg class="wheel" id="wheel" viewBox="0 0 220 220" role="img" aria-label="Roue des qualifiés">${wheelSVG(roue, sansNoms)}</svg></div>
      <button class="btn gold block" id="spin">Voir la rediffusion du tirage</button>
      <div class="draw-res" id="res" aria-live="polite"></div>
    </div>` + blocPrec;
  const wheel = $("#wheel"); let tourne = false;
  const premier = t.gagnants[0], moi = t.gagnants.find(g => g.moi);
  $("#spin").onclick = () => {
    if (tourne) return; tourne = true; $("#spin").disabled = true;
    const n = roue.length, a = 360 / n, i = Math.max(0, roue.indexOf(premier.nom));
    const finA = 360 * 7 - (i + .5) * a + (Math.random() - .5) * a * .6;
    wheel.style.transition = "none"; wheel.style.transform = "rotate(0deg)"; wheel.getBoundingClientRect();
    wheel.style.transition = ""; wheel.style.transform = `rotate(${finA}deg)`;
    setTimeout(() => {
      const res = $("#res"); if (!res) return;
      const autres = t.gagnants.filter(g => !g.moi);
      res.innerHTML = (moi
        ? `<div class="arcade" style="font-size:30px;margin-top:16px">Tu as gagné !</div>
           <p style="margin:10px 0 4px">Bravo ${esc(moi.nom)}, tu remportes :</p>
           <p style="font-family:var(--f-title);font-weight:800;font-size:20px;color:var(--red-deep)">${esc(moi.lot || "un lot")}</p>
           <p class="muted">Le CSE te contactera pour la remise du lot.</p>`
          + (autres.length ? `<p class="muted">Autres gagnants : ${esc(autres.map(g => g.nom).join(", "))}</p>` : "")
        : `<p style="margin-top:16px">${t.gagnants.length > 1 ? "Les gagnants sont" : "Le gagnant est"}</p>
           ${t.gagnants.map(g => `<div class="arcade" style="font-size:26px">${esc(g.nom)}</div>${g.lot ? `<p class="muted" style="margin:4px 0 10px">${esc(g.lot)}</p>` : ""}`).join("")}
           <p class="muted" style="margin-top:8px">Ce n’est pas toi cette fois, rendez-vous à la case suivante !</p>`)
        + `<p class="verif">Code de vérification du tirage : ${esc(t.code)}</p>`;
      res.classList.add("show"); $("#spin").textContent = "Revoir la rediffusion"; $("#spin").disabled = false; tourne = false;
      if (moi) confetti();
    }, reduit() ? 50 : 5300);
  };
}

/* ====================== Page de jeu (commune à tous les jeux) ====================== */
let partie = null;
const titreJeu = (n, g) => `<a class="back" href="#accueil">‹ Calendrier</a><h1 class="page-title"><span class="n">Case ${n}</span>${g ? esc(nomJeu(g)) : "Surprise"}</h1>`;

function vueJeu(n){
  const g = jeuDu(n);
  const titre = titreJeu(n, g);
  if (n > state.jour || !g){
    app.innerHTML = titre + `<div class="panel"><h2>Encore un peu de patience</h2><p>Cette case s’ouvre le ${n} décembre.</p><a class="btn block" href="#accueil">Retour au calendrier</a></div>`;
    return;
  }
  if (state.joues[n]) return vueResultat(n);
  if (n < state.jour){
    app.innerHTML = titre + `<div class="panel"><h2>Ce jeu est terminé</h2><p>Tu n’as pas joué ce jour-là. Le tirage de cette case a déjà eu lieu ou va avoir lieu.</p><a class="btn block" href="#accueil">Retour au calendrier</a></div>`;
    return;
  }
  const G = GAMES[g];
  app.innerHTML = titre + `
    <div class="objectif"><span class="ic">${ico("ticket")}</span><div><small>Pour participer au tirage</small><b>${esc(OBJECTIFS[g])}</b></div></div>
    <div class="panel tilt-l"><span class="tape l"></span><span class="tape r"></span>
      <h2>Comment jouer</h2>
      <div class="steps">${G.steps.map(([i, t]) => `<div class="step"><div class="ic">${ico(i)}</div><b>${esc(t)}</b></div>`).join("")}</div>
      <div class="qualif"><span class="ic">${ico("ticket")}</span><div>${esc(G.qualif)}</div></div>
    </div>
    <div class="panel" id="zone"></div>`;
  accueilZone(n);
}

function accueilZone(n, apresTuto = false){
  const zone = $("#zone"); if (!zone) return;
  zone.innerHTML = `<h2>${apresTuto ? "Entraînement terminé" : "Entraîne-toi d’abord"}</h2>
    <p>${apresTuto ? "Tu as compris le principe ? Quand tu es prêt, lance ta vraie partie." : "15 secondes pour essayer, ça ne compte pas."}</p>
    <button class="btn ghost block" id="tuto">${apresTuto ? "Réessayer 15 secondes" : "Essayer 15 secondes"}</button>
    <div style="height:10px"></div><button class="btn block" id="start">Démarrer le jeu</button>`;
  $("#tuto").onclick = () => lancerTuto(n);
  $("#start").onclick = () => confirmer(n);
}

function lancerTuto(n){
  const zone = $("#zone");
  zone.innerHTML = `<div class="tuto-band"><span>Entraînement, ça ne compte pas</span><span id="tt">15 s</span></div><div id="pl"></div>`;
  zone.scrollIntoView({ behavior: reduit() ? "auto" : "smooth", block: "start" });
  let reste = 15, fini = false, nettoie = () => {};
  const fin = () => { if (fini) return; fini = true; clearInterval(iv); nettoie(); partie = null; setTimeout(() => accueilZone(n, true), 300); };
  const iv = setInterval(() => { reste--; const el = $("#tt"); if (!el){ fin(); return; } el.textContent = reste + " s"; if (reste <= 0) fin(); }, 1000);
  nettoie = GAMES[jeuDu(n)].tuto($("#pl"), fin) || (() => {});
  partie = { stop: () => { clearInterval(iv); nettoie(); }, tuto: true };
}

function confirmer(n){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    ${ico("chrono", "")}<h3 id="mt">Un seul essai aujourd’hui</h3>
    <p>Le jeu démarre dès que tu confirmes. Si tu quittes la page pendant la partie, ton essai est perdu.</p>
    <div class="row"><button class="btn ghost" id="no">Plus tard</button><button class="btn" id="yes">C’est parti</button></div></div>`;
  bg.querySelector("svg").setAttribute("style", "width:52px;height:52px");
  document.body.appendChild(bg);
  const close = () => bg.remove();
  $("#no", bg).onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  $("#yes", bg).focus();
  $("#yes", bg).onclick = () => { close(); if (partie && partie.tuto){ partie.stop(); partie = null; } lancerPartie(n); };
}

async function lancerPartie(n){
  const g = jeuDu(n), zone = $("#zone");
  zone.innerHTML = `<p class="muted" style="text-align:center">Préparation de ta partie…</p>`;
  let d;
  try { d = await rpc("demarrer_partie", { p_token: state.token, p_jour: n }); }
  catch (e){
    if (e.session) return sessionExpiree();
    if (!$("#zone")) return;
    $("#zone").innerHTML = `<h2>Connexion impossible</h2><p>Ta partie n’a pas démarré et ton essai n’est pas consommé. Vérifie ta connexion internet et réessaie.</p><button class="btn block" id="re">Réessayer</button>`;
    $("#re").onclick = () => lancerPartie(n);
    return;
  }
  if (d.erreur){
    try { await rafraichir(); } catch {}
    if (d.erreur === "deja_joue" && state.joues[n]) return vueResultat(n);
    toast("Cette case est fermée."); go("accueil"); return;
  }
  if (!$("#zone")) return;
  const z = $("#zone");
  z.innerHTML = `<div id="pl"></div><div class="warn" id="warn"></div>`;
  z.scrollIntoView({ behavior: reduit() ? "auto" : "smooth", block: "start" });
  state.joues[n] = { ok: false, pts: 0, abandon: true }; /* tant que la partie n’est pas finie */
  let sorties = 0, termine = false;
  const onVis = () => { if (document.hidden){ sorties++; const w = $("#warn"); if (w){ w.textContent = `Tu as quitté la page ${sorties} fois pendant la partie. C’est signalé à l’organisateur.`; w.classList.add("show"); } } };
  document.addEventListener("visibilitychange", onVis);
  const nettoie = GAMES[g].play($("#pl"), async res => {
    if (termine) return; termine = true;
    partie && partie.stop(); partie = null;
    const pts = Math.round(res.pts != null ? res.pts : (res.ok ? 60 : 5));
    const stat = res.stat || (res.ms ? fmtTime(res.ms) : "");
    const envoi = { p_token: state.token, p_partie: d.partie, p_ok: !!res.ok, p_pts: pts, p_stat: stat, p_sorties: sorties };
    store.set(CLE_ATTENTE, envoi);
    let r = null;
    for (let i = 0; i < 3 && !r; i++){
      try { r = await rpc("terminer_partie", envoi); }
      catch (e){ if (e.session) break; await new Promise(ok => setTimeout(ok, 1500 * (i + 1))); }
    }
    if (r){
      store.set(CLE_ATTENTE, null);
      state.joues[n] = { ok: r.ok, pts: r.pts, stat: r.stat, suspect: r.suspect };
      try { await rafraichir(); } catch {}
    } else {
      state.joues[n] = { ok: !!res.ok, pts, stat, attente: true };
    }
    header();
    setTimeout(() => vueResultat(n, true), state.joues[n].ok ? 500 : 200);
  }) || (() => {});
  partie = { stop: () => { nettoie(); document.removeEventListener("visibilitychange", onVis); } };
}

function vueResultat(n, frais = false){
  const j = state.joues[n], g = jeuDu(n);
  const { rang, total } = monRang();
  const motifSuspect = { trop_rapide: "Ta partie s’est terminée anormalement vite : elle n’a pas pu être validée.", hors_delai: "Ta partie a dépassé le temps maximum : elle n’a pas pu être validée." };
  const corps = j.attente
    ? `<span class="badge ko">Résultat pas encore envoyé</span><p style="margin-top:12px">La connexion a été coupée en fin de partie. Ton résultat est gardé sur cet appareil et sera envoyé automatiquement à ta prochaine visite. Reviens vite, avant le tirage.</p>`
    : j.suspect
    ? `<span class="badge ko">Partie non validée</span><p style="margin-top:12px">${motifSuspect[j.suspect] || "Ta partie n’a pas pu être validée."} Si c’est une erreur, contacte ton CSE.</p>`
    : j.abandon
    ? `<span class="badge ko">Partie interrompue</span><p style="margin-top:12px">Tu as quitté la page pendant ta partie : ton essai du jour est utilisé.</p>`
    : j.ok
      ? `<span class="badge ok">Qualifié pour le tirage</span>${j.stat ? `<div class="big">${esc(j.stat)}</div>` : ""}
         <p>${j.pts} points gagnés.${rang ? ` Tu es <b>${rang}e sur ${total}</b> au classement général.` : ""}</p>
         <p class="muted">Tirage ${n === 24 ? "ce soir à 17h01" : "demain à 00h01"}. Bonne chance !</p>`
      : `<span class="badge ko">Pas qualifié cette fois</span>${j.stat ? `<div class="big" style="font-size:30px">${esc(j.stat)}</div>` : ""}
         <p>${j.pts} points quand même. Une nouvelle case t’attend demain !</p>`;
  app.innerHTML = titreJeu(n, g) + `<div class="panel result"><span class="tape l"></span><span class="tape r"></span>
    ${frais && j.ok ? `<div class="arcade" style="color:var(--red);text-shadow:2px 2px 0 var(--gold);font-size:30px">Bravo !</div>` : `<h2>Ton résultat</h2>`}
    ${corps}
    ${g && OBJECTIFS[g] ? `<p class="muted" style="margin-top:10px">Objectif du jour : ${esc(OBJECTIFS[g])}</p>` : ""}
    <div style="display:grid;gap:10px;margin-top:16px"><a class="btn block" href="#accueil">Retour au calendrier</a><a class="btn ghost block" href="#classement">Voir le classement</a></div></div>`;
  if (frais) window.scrollTo(0, 0);
  if (frais && j.ok) confetti(90);
}

/* ====================== Confettis ====================== */
let confettiId = 0;
function confetti(nb = 180){
  if (reduit()) return;
  const id = ++confettiId;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  const cols = ["#A8232B", "#D6A243", "#1E5141", "#FFFFFF", "#FFE7A6"];
  const ps = Array.from({ length: nb }, () => ({ x: Math.random() * W, y: -Math.random() * H * .5, vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5,
    s: (5 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy * devicePixelRatio; p.r += p.vr; p.vy += .04;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 4500 && id === confettiId) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* ====================== Console du CSE (réservée aux admins) ====================== */
let adminData = null;
const MSG_ADMIN = {
  soi_meme: "Tu ne peux pas faire ça sur ton propre compte.",
  deja_gagne: "Ce lot a déjà été gagné, il ne peut plus être modifié.",
  libelle_vide: "Indique le nom du lot.", jour_invalide: "Le jour doit être entre 1 et 24.",
  nom_vide: "Indique le nom du CSE.", nb_gagnants: "Le nombre de gagnants doit être entre 1 et 20.",
  inconnu: "Personne introuvable.",
};
const pl = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
async function chargerAdmin(){ adminData = await rpc("admin_etat", { p_token: state.token }); }
async function actionAdmin(fn, args, okMsg){
  try {
    const r = await rpc(fn, Object.assign({ p_token: state.token }, args));
    if (r && r.erreur){ toast(MSG_ADMIN[r.erreur] || "Action impossible."); return false; }
    await chargerAdmin();
    if (okMsg) toast(okMsg);
    return r || true;
  } catch (e){
    if (e.session){ sessionExpiree(); return false; }
    toast("Action impossible pour le moment, réessaie."); return false;
  }
}

async function vueAdmin(){
  if (!state.data.moi.admin){ go("accueil"); return; }
  app.innerHTML = `<div class="panel" style="text-align:center"><p>Chargement de la console…</p></div>`;
  try { await chargerAdmin(); }
  catch (e){
    if (e.session) return sessionExpiree();
    app.innerHTML = `<a class="back" href="#accueil">‹ Calendrier</a><div class="panel"><h2>Console indisponible</h2><p>${/acces_refuse/.test(e.message) ? "Ton compte n’est pas administrateur." : "Vérifie ta connexion internet et réessaie."}</p></div>`;
    return;
  }
  rendreAdmin("participants");
}

function rendreAdmin(onglet){
  const d = adminData;
  const tabs = [["participants", "Participants"], ["lots", "Lots"], ["suivi", "Suivi"], ["reglages", "Réglages"]];
  app.innerHTML = `<a class="back" href="#accueil">‹ Calendrier</a><h1 class="page-title">Console du CSE</h1>
    ${d.cse.actif ? "" : `<div class="panel adm-alerte"><b>Calendrier fermé aux participants.</b> Seuls les admins peuvent se connecter pour l’instant. Tu l’ouvriras dans l’onglet Réglages.</div>`}
    <div class="tabs adm-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === onglet}" data-t="${k}">${l}</button>`).join("")}</div>
    <div id="adm"></div>`;
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => rendreAdmin(b.dataset.t));
  ({ participants: admParticipants, lots: admLots, suivi: admSuivi, reglages: admReglages })[onglet]($("#adm"));
}

/* Lignes collées depuis Excel : l’e-mail est repéré par son @, puis prénom, puis nom. */
function lireLignes(txt){
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const cols = l.split(/\t|;|,/).map(c => c.trim()).filter(Boolean);
    const email = cols.find(c => c.includes("@"));
    if (!email) return null;
    const autres = cols.filter(c => c !== email);
    return { email, prenom: autres[0] || "", nom: autres.slice(1).join(" ") };
  }).filter(Boolean);
}

function admParticipants(el){
  const s = adminData.salaries, presents = s.filter(x => x.statut !== "retire");
  const lib = { actif: "Code choisi", jamais: "Jamais connecté", bloque: "Bloqué (trop de codes faux)", retire: "Retiré" };
  el.innerHTML = `
    <div class="panel"><h2>Ajouter des participants</h2>
      <p class="muted">Colle une ligne par personne, par exemple depuis Excel : e-mail, prénom et nom. Toute adresse convient, professionnelle ou personnelle : aucun e-mail n’est envoyé, l’adresse sert seulement d’identifiant.</p>
      <textarea class="input adm-zone" id="imp" rows="5" placeholder="julie.roux@exemple.fr    Julie    Roux"></textarea>
      <p class="muted" id="impInfo" style="min-height:1.2em;margin:6px 0"></p>
      <button class="btn block" id="impOk">Ajouter à la liste</button></div>
    <div class="panel"><h2>Liste d’accès</h2>
      <p class="muted">${pl(presents.length, "personne")}, dont ${presents.filter(x => x.statut === "actif").length} déjà connectée${presents.filter(x => x.statut === "actif").length > 1 ? "s" : ""}.</p>
      <input class="input" id="filtre" placeholder="Rechercher un nom ou un e-mail">
      <ul class="adm-liste" id="liste"></ul></div>`;
  $("#imp").oninput = () => { const n = lireLignes($("#imp").value).length; $("#impInfo").textContent = n ? `${pl(n, "personne")} détectée${n > 1 ? "s" : ""}.` : ""; };
  $("#impOk").onclick = async () => {
    const lignes = lireLignes($("#imp").value);
    if (!lignes.length){ toast("Aucune adresse e-mail détectée."); return; }
    $("#impOk").disabled = true;
    const r = await actionAdmin("admin_ajouter_salaries", { p_lignes: lignes });
    if (!r){ $("#impOk").disabled = false; return; }
    rendreAdmin("participants");
    toast(`${pl(r.ajoutes, "ajout")}, ${r.mis_a_jour} mise${r.mis_a_jour > 1 ? "s" : ""} à jour${r.invalides.length ? `, ${pl(r.invalides.length, "ligne")} ignorée${r.invalides.length > 1 ? "s" : ""} (prénom ou e-mail manquant)` : ""}.`);
  };
  const dessiner = () => {
    const f = $("#filtre").value.trim().toLowerCase();
    const vus = s.filter(x => !f || `${x.email} ${x.prenom} ${x.nom}`.toLowerCase().includes(f));
    $("#liste").innerHTML = vus.map(x => `
      <li class="${x.statut === "retire" ? "off" : ""}">
        <div class="qui"><b>${esc(x.prenom)} ${esc(x.nom)}${x.admin ? ` <span class="adm-tag">admin</span>` : ""}${x.moi ? " (toi)" : ""}</b>
          <span class="muted">${esc(x.email)}</span>
          <span class="adm-statut s-${x.statut}">${lib[x.statut]}${x.parties ? ` · ${pl(x.parties, "partie")}` : ""}</span></div>
        <div class="act">${x.statut === "retire"
          ? `<button data-a="reintegrer" data-id="${x.id}">Réintégrer</button>`
          : `${x.statut !== "jamais" ? `<button data-a="reinitialiser" data-id="${x.id}">Réinitialiser le code</button>` : ""}
             ${x.moi ? "" : `<button data-a="${x.admin ? "admin_non" : "admin_oui"}" data-id="${x.id}">${x.admin ? "Retirer l’accès admin" : "Rendre admin"}</button>
             <button data-a="retirer" data-id="${x.id}">Retirer</button>`}`}</div>
      </li>`).join("") || `<li class="muted">Aucun résultat.</li>`;
    $("#liste").querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
      const x = s.find(y => y.id === b.dataset.id), a = b.dataset.a;
      const question = {
        reinitialiser: `Réinitialiser le code de ${x.prenom} ${x.nom} ? Il choisira un nouveau code à sa prochaine connexion.`,
        retirer: `Retirer ${x.prenom} ${x.nom} de la liste ? Il ne pourra plus se connecter ni gagner, son historique est conservé.`,
        admin_oui: `Donner l’accès à cette console à ${x.prenom} ${x.nom} ?`,
      }[a];
      if (question && !confirm(question)) return;
      const ok = await actionAdmin("admin_salarie", { p_id: x.id, p_action: a }, {
        reinitialiser: "Code réinitialisé.", retirer: "Accès retiré.", reintegrer: "Accès rétabli.",
        admin_oui: "Accès admin donné.", admin_non: "Accès admin retiré." }[a]);
      if (ok) rendreAdmin("participants");
    });
  };
  $("#filtre").oninput = dessiner; dessiner();
}

function admLots(el){
  const d = adminData, parJour = d.cse.mode_lots === "par_jour";
  const dispo = d.lots.filter(l => !l.gagnant);
  const faits = new Set(d.jours.filter(j => j.tirage).map(j => j.jour));
  let alerte = "";
  if (parJour){
    const sansLot = Array.from({ length: 24 }, (_, i) => i + 1).filter(j => !faits.has(j) && !dispo.some(l => l.jour === j));
    if (sansLot.length) alerte = `Aucun lot n’est prévu pour ${sansLot.length > 6 ? pl(sansLot.length, "case") : "les cases " + sansLot.join(", ")}. Sans lot, le tirage de ces cases n’aura pas de gagnant.`;
  } else {
    const besoin = (24 - faits.size) * d.cse.nb_gagnants;
    if (dispo.length < besoin) alerte = `Il reste ${pl(dispo.length, "lot")} pour ${besoin} gagnant${besoin > 1 ? "s" : ""} à venir. Sans lot, un tirage n’a pas de gagnant.`;
  }
  const optJours = sel => Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}" ${sel === i + 1 ? "selected" : ""}>Case du ${i + 1} décembre</option>`).join("");
  el.innerHTML = `
    ${alerte ? `<div class="panel adm-alerte">${alerte}</div>` : ""}
    <div class="panel"><h2>Ajouter un lot</h2>
      <input class="input" id="lotLib" placeholder="Ex. : 2 places de cinéma">
      ${parJour ? `<div style="height:10px"></div><select class="input" id="lotJour" aria-label="Case du jour">${optJours(0)}</select>` : ""}
      <div style="height:10px"></div><button class="btn block" id="lotOk">Ajouter</button></div>
    <div class="panel"><h2>Les lots</h2>
      <p class="muted">${parJour ? "Chaque lot est mis en jeu le jour indiqué." : "Chaque gagnant reçoit un lot tiré au hasard parmi ceux qui restent."} Un lot gagné ne peut plus être modifié.</p>
      <ul class="adm-liste">${d.lots.map(l => `<li class="${l.gagnant ? "off" : ""}">
        <div class="qui"><b>${esc(l.libelle)}</b>
          ${parJour ? `<span class="muted">${l.jour ? `Case du ${l.jour} décembre` : "Sans jour : ne sera pas mis en jeu"}</span>` : ""}
          ${l.gagnant ? `<span class="adm-statut s-actif">Gagné par ${esc(l.gagnant)} (case ${l.gagne_jour})</span>` : ""}</div>
        <div class="act">${l.gagnant ? "" : `<button data-e="${l.id}">Modifier</button><button data-s="${l.id}">Supprimer</button>`}</div></li>`).join("") || `<li class="muted">Aucun lot pour l’instant.</li>`}</ul></div>`;
  $("#lotOk").onclick = async () => {
    const lib = $("#lotLib").value.trim(); if (!lib){ toast("Indique le nom du lot."); return; }
    const ok = await actionAdmin("admin_lot", { p_id: null, p_libelle: lib, p_ordre: null, p_jour: parJour ? +$("#lotJour").value : null, p_supprimer: false }, "Lot ajouté.");
    if (ok) rendreAdmin("lots");
  };
  el.querySelectorAll("button[data-e]").forEach(b => b.onclick = async () => {
    const l = d.lots.find(x => x.id === b.dataset.e);
    const lib = prompt("Nom du lot", l.libelle); if (lib == null) return;
    let jour = l.jour;
    if (parJour){ const r = prompt("Case du jour (1 à 24)", l.jour || ""); if (r == null) return; jour = parseInt(r, 10) || null; }
    const ok = await actionAdmin("admin_lot", { p_id: l.id, p_libelle: lib, p_ordre: l.ordre, p_jour: jour, p_supprimer: false }, "Lot modifié.");
    if (ok) rendreAdmin("lots");
  });
  el.querySelectorAll("button[data-s]").forEach(b => b.onclick = async () => {
    const l = d.lots.find(x => x.id === b.dataset.s);
    if (!confirm(`Supprimer le lot « ${l.libelle} » ?`)) return;
    const ok = await actionAdmin("admin_lot", { p_id: l.id, p_libelle: null, p_ordre: null, p_jour: null, p_supprimer: true }, "Lot supprimé.");
    if (ok) rendreAdmin("lots");
  });
}

function admSuivi(el){
  const jours = adminData.jours.slice().reverse(), auj = adminData.cse.jour;
  el.innerHTML = `<div class="panel"><h2>Jour par jour</h2>
    ${jours.length ? `<p class="muted">Les gagnants apparaissent ici avec leur adresse e-mail, pour la remise des lots.</p><ul class="adm-liste">${jours.map(x => `<li>
      <div class="qui"><b>Case ${x.jour} · ${esc(nomJeu(x.jeu))}</b>
        <span class="muted">${pl(x.joueurs, "joueur")}, ${pl(x.qualifies, "qualifié")}${x.signales ? ` · ${pl(x.signales, "partie")} signalée${x.signales > 1 ? "s" : ""} (sortie de page ou durée anormale)` : ""}</span>
        ${x.tirage
          ? (x.tirage.gagnants.length
              ? x.tirage.gagnants.map(g => `<span class="adm-statut s-actif">Gagnant : ${esc(g.nom)} · ${esc(g.email)}${g.lot ? ` · ${esc(g.lot)}` : ""}</span>`).join("")
              : `<span class="adm-statut">Tirage fait, sans gagnant${x.tirage.nb_qualifies ? " (plus de lot disponible)" : " (aucun qualifié)"}</span>`)
            + `<span class="muted">Code de vérification : ${esc(x.tirage.code)}</span>`
          : `<span class="muted">${x.jour === auj ? "Case en cours aujourd’hui" : "Tirage en attente"}</span>`}</div></li>`).join("")}</ul>`
      : `<p>Le calendrier n’a pas encore commencé : le suivi apparaîtra à partir du 1er décembre.</p>`}</div>`;
}

function admReglages(el){
  const c = adminData.cse;
  const lien = location.origin + location.pathname + "?cse=" + c.slug;
  el.innerHTML = `
    <div class="panel"><h2>Lien à partager</h2>
      <p class="muted">Donne ce lien aux participants. Ils se connectent avec l’adresse e-mail inscrite dans la liste d’accès.</p>
      <input class="input" id="lien" readonly value="${esc(lien)}">
      <div style="height:10px"></div><button class="btn ghost block" id="copier">Copier le lien</button></div>
    <div class="panel"><h2>Réglages</h2>
      <label class="field" for="rNom">Nom affiché</label><input class="input" id="rNom" value="${esc(c.nom)}">
      <label class="field" for="rNb" style="margin-top:14px">Gagnants par tirage</label>
      <input class="input" id="rNb" type="number" min="1" max="20" inputmode="numeric" value="${c.nb_gagnants}">
      <p class="muted" style="margin:6px 0 0">Un changement s’applique seulement aux tirages suivants.</p>
      <label class="field" for="rMode" style="margin-top:14px">Attribution des lots</label>
      <select class="input" id="rMode">
        <option value="hasard" ${c.mode_lots === "hasard" ? "selected" : ""}>Au hasard parmi les lots restants</option>
        <option value="par_jour" ${c.mode_lots === "par_jour" ? "selected" : ""}>Un lot fixé à l’avance pour chaque case</option></select>
      <label class="adm-check" style="margin-top:16px"><input type="checkbox" id="rActif" ${c.actif ? "checked" : ""}> Calendrier ouvert aux participants</label>
      ${c.date_simulee ? `<p class="muted">Calendrier de test : la date est simulée au ${new Date(c.date_simulee + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}.</p>` : ""}
      <div style="height:12px"></div><button class="btn block" id="rOk">Enregistrer</button></div>`;
  $("#copier").onclick = async () => {
    try { await navigator.clipboard.writeText(lien); toast("Lien copié."); }
    catch { $("#lien").select(); toast("Sélectionne le lien pour le copier."); }
  };
  $("#rOk").onclick = async () => {
    if (!$("#rActif").checked && c.actif && !confirm("Fermer le calendrier ? Les participants ne pourront plus se connecter.")) return;
    const ok = await actionAdmin("admin_reglages", { p_nom: $("#rNom").value, p_nb_gagnants: parseInt($("#rNb").value, 10), p_mode_lots: $("#rMode").value, p_actif: $("#rActif").checked }, "Réglages enregistrés.");
    if (ok){ try { await rafraichir(); } catch {} header(); rendreAdmin("reglages"); }
  };
}

/* ====================== Routeur ====================== */
function go(v){ if (location.hash === "#" + v) route(); else location.hash = v; }
let routeId = 0;
async function route(){
  const id = ++routeId;
  confettiId++;
  if (partie){ partie.stop(); partie = null; }
  document.querySelectorAll(".modal-bg").forEach(m => m.remove());
  const v = (location.hash || "#accueil").slice(1);
  if (v === "reglement"){ vueReglement(); header(); window.scrollTo(0, 0); return; }
  if (!state.token){ vueConnexion(); header(); return; }
  if (v === "deconnexion"){ deconnecter(); return; }
  if (!state.data || Date.now() - state.chargeLe > 30000 || ["accueil", "tirage", "classement", "lots"].includes(v)){
    if (!state.data) app.innerHTML = `<div class="panel" style="text-align:center"><p>Chargement du calendrier…</p></div>`;
    try { await rafraichir(); }
    catch (e){
      if (id !== routeId) return;
      if (e.session) return sessionExpiree();
      if (!state.data){
        app.innerHTML = `<div class="panel"><h2>Connexion impossible</h2><p>Le calendrier n’a pas pu être chargé. Vérifie ta connexion internet et réessaie.</p><button class="btn block" id="re">Réessayer</button></div>`;
        $("#re").onclick = () => route();
        return;
      }
    }
  }
  if (id !== routeId) return;
  if (!state.profil.av && v !== "avatar"){ vueAvatar(); header(); return; }
  if (v === "avatar") vueAvatar();
  else if (v === "classement") vueClassement("joueurs");
  else if (v === "lots") vueClassement("lots");
  else if (v === "tirage") vueTirage();
  else if (v === "admin") vueAdmin();
  else if (/^jeu-\d+$/.test(v) && +v.slice(4) >= 1 && +v.slice(4) <= 24) vueJeu(+v.slice(4));
  else vueAccueil();
  header(); window.scrollTo(0, 0);
}

/* Page laissée ouverte longtemps (par exemple la veille au soir) : on recharge au retour. */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.data && !partie && Date.now() - state.chargeLe > 5 * 60000){
    const v = (location.hash || "#accueil").slice(1);
    if (!/^jeu-/.test(v)) route();
  }
});

motif();
addEventListener("hashchange", route);
route();
})();
